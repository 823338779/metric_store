version: 2

# 仅声明 StarRocks 中已存在的原始表；dbt 不负责创建或写入这些表。
sources:
  - name: ecommerce_raw
    description: 独立于 dbt 管理的电商模拟原始数据，由 generate_raw_data.py 随机生成。
    schema: ecommerce_raw
    tables:
      - name: users
        description: 用户原表，每名用户一行。
        columns:
          - name: user_id
            description: 用户主键。
            data_tests: [not_null, unique]
      - name: products
        description: 商品原表，包含类目、品牌、标价与上架日期。
        columns:
          - name: product_id
            description: 商品主键。
            data_tests: [not_null, unique]
          - name: listed_at
            description: 商品首次上架日期；订单不会引用尚未上架的商品。
      - name: shops
        description: 店铺原表，包含地区、经营类型与开业日期。
        columns:
          - name: shop_id
            description: 店铺主键。
            data_tests: [not_null, unique]
          - name: opened_at
            description: 店铺开业日期；订单不会引用尚未开业的店铺。
      - name: orders
        description: 订单原表，每天笔数浮动，覆盖已支付、取消和退款状态。
        columns:
          - name: order_id
            description: 订单主键。
            data_tests: [not_null, unique]
          - name: ordered_at
            description: 下单日期，覆盖 2020-01-01 至 2027-12-31。
            data_tests: [not_null]
      - name: order_items
        description: 订单商品明细原表，每笔订单一至四条明细。
        columns:
          - name: order_item_id
            description: 订单商品明细主键。
            data_tests: [not_null, unique]
      - name: payments
        description: 支付流水原表，记录已支付及退款订单。
        columns:
          - name: payment_id
            description: 支付流水主键。
            data_tests: [not_null, unique]
      - name: refunds
        description: 退款流水原表，记录退款金额和原因。
        columns:
          - name: refund_id
            description: 退款流水主键。
            data_tests: [not_null, unique]
