version: 2

# 显示字典不声明指标；原始键由固定数据保证唯一，不增加字典重复键扫描。
models:
  - name: demo_mapping_status_codes
    description: 状态显示字典；200 为成功，404 和 502 都为失败，503 显示值为空，504 显示值为空字符串。
    semantic_model:
      enabled: true
    columns:
      - name: code
        description: 唯一且非空的原始状态代码；作为映射键，不作为业务计算维度发现。
        entity: {name: demo_mapping_status_key, type: primary}
        dimension: {name: raw_value, type: categorical}
        data_tests: [not_null]
      - name: label
        description: 最终输出的文本；允许 NULL 和空字符串，不要求唯一。
        dimension: {name: display_value, type: categorical}

  - name: demo_mapping_channels
    description: 渠道显示字典；原始代码 1 和 2 分别显示为网页和应用。
    semantic_model:
      enabled: true
    columns:
      - name: code
        description: 唯一且非空的渠道代码，作为显示关联的原始键。
        entity: {name: demo_mapping_channel_key, type: primary}
        dimension: {name: raw_value, type: categorical}
        data_tests: [not_null]
      - name: label
        description: 渠道的文本显示值。
        dimension: {name: display_value, type: categorical}
        data_tests: [not_null]

  - name: demo_mapping_orders
    description: 维值映射示例订单；八笔订单总金额为 182，所有计算均使用原始维度值。
    semantic_model:
      enabled: true
    agg_time_dimension: ordered_at
    columns:
      - name: order_id
        description: 订单唯一标识，一行代表一笔订单。
        entity: {name: demo_mapping_order, type: primary}
        data_tests: [not_null, unique]
      - name: user_id
        description: 下单用户；用户 20 同时出现在 404 和 502，用于验证去重指标不会按显示值重算。
        data_tests: [not_null]
      - name: ordered_at
        description: 固定模拟下单日期，作为指标的默认聚合时间。
        granularity: day
        dimension: {type: time}
        data_tests: [not_null]
      - name: status_code
        description: 原始状态代码，筛选和排序使用本列，查询输出通过状态 semantic model 映射。
        dimension:
          type: categorical
          value_mapping:
            semantic_model: demo_mapping_status_codes
            value_dimension: raw_value
            display_dimension: display_value
      - name: target_status_code
        description: 原始目标状态；与状态列复用同一字典，但使用独立 LEFT JOIN。
        dimension:
          type: categorical
          value_mapping:
            semantic_model: demo_mapping_status_codes
            value_dimension: raw_value
            display_dimension: display_value
        data_tests: [not_null]
      - name: channel_code
        description: 原始渠道代码；展示时通过渠道 semantic model 映射。
        dimension:
          type: categorical
          value_mapping:
            semantic_model: demo_mapping_channels
            value_dimension: raw_value
            display_dimension: display_value
        data_tests: [not_null]
      - name: amount
        description: 订单金额；404 两笔合计 50，502 一笔为 10，不因显示值相同而合并。
        data_tests: [not_null]
    metrics:
      - name: demo_mapping_amount
        description: 按原始维度分组的订单总金额，映射仅改变结果文本。
        type: simple
        agg: sum
        expr: amount
      - name: demo_mapping_users
        description: 按原始维度分组的去重用户数，相同显示名不合并用户集合。
        type: simple
        agg: count_distinct
        expr: user_id

metrics:
  - name: demo_mapping_amount_per_user
    description: 各原始分组的订单金额除以去重用户数，先计算比率再映射显示值。
    type: ratio
    type_params:
      numerator: demo_mapping_amount
      denominator: demo_mapping_users
