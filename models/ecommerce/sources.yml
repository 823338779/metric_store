# 固定只读来源；输出使用 profile 指定的独立 schema。
version: 2
sources:
- name: ecommerce_dw
  schema: ecommerce_dw
  description: 现有 ODS 电商演示数据，只读源数据，不运行 seed。
  tables:
  # 售后金额由退款流水提供，每笔退款只读取一次。
  - name: ods_refunds
    description: 退款流水，refund_id 唯一，order_id 关联订单头。
  - name: ods_orders
    description: ODS 订单头，一行一订单。
    columns:
    - name: order_id
      description: 源表唯一业务键。
      data_tests:
      - not_null
      - unique
    - name: biz_date
      description: 下单日期。
    - name: customer_id
      description: 购买用户键。
    - name: store_id
      description: 所属店铺键。
    - name: sales_channel
      description: 销售渠道。
    - name: order_status
      description: 当前订单状态。
    - name: total_quantity
      description: 订单商品件数。
    - name: gross_amount
      description: 折前商品金额，元。
    - name: discount_amount
      description: 优惠金额，元。
    - name: shipping_amount
      description: 运费，元。
    - name: payable_amount
      description: 订单折后应付总额，含运费，用于明细对账。
    - name: paid_amount
      description: 原始成功支付金额，含运费，退款前口径；取消订单为零。
  - name: ods_order_items
    description: ODS 订单商品明细，一行一明细。
    columns:
    - name: order_item_id
      description: 源表唯一业务键。
      data_tests:
      - not_null
      - unique
    - name: order_id
      description: 所属订单标识。
      data_tests:
      - not_null
      - relationships:
          arguments:
            to: source('ecommerce_dw', 'ods_orders')
            field: order_id
    - name: biz_date
      description: 源明细下单日期。
    - name: product_id
      description: 商品键。
    - name: quantity
      description: 明细件数。
    - name: unit_price
      description: 明细单价，元。
    - name: gross_amount
      description: 明细折前金额，元。
    - name: discount_amount
      description: 明细优惠，元。
    - name: payable_amount
      description: 明细折后应付金额，元，不含运费。
  - name: ods_customers
    description: ODS 客户注册表。
    columns:
    - name: customer_id
      description: 源表唯一业务键。
      data_tests:
      - not_null
      - unique
    - name: member_level
      description: 注册时会员等级，不表示下单时的等级。
    - name: province
      description: 用户所在省份，与店铺省份独立。
    - name: biz_date
      description: 用户注册日期，用户指标默认聚合时间。
    - name: acquisition_channel
      description: 用户首次获客渠道。
  - name: ods_products
    description: ODS 商品上架表。
    columns:
    - name: product_id
      description: 源表唯一业务键。
      data_tests:
      - not_null
      - unique
    - name: sku_code
      description: 商品 SKU 编码。
    - name: product_name
      description: 当前商品名称。
    - name: category
      description: 商品一级类目。
    - name: brand
      description: 商品品牌。
    - name: list_price
      description: 当前商品标价，单位元，不作为历史成交价。
    - name: cost_price
      description: 当前商品成本单价，单位元；不用于推算历史毛利。
    - name: biz_date
      description: 商品首次上架日期，商品指标默认聚合时间。
  - name: ods_stores
    description: ODS 商家入驻表。
    columns:
    - name: store_id
      description: 源表唯一业务键。
      data_tests:
      - not_null
      - unique
    - name: store_name
      description: 店铺名称。
    - name: province
      description: 店铺所在省份，与用户省份独立。
    - name: biz_date
      description: 店铺开店日期，店铺指标默认聚合时间。
