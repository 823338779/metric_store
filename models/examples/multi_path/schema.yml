version: 2

# 独立的固定模拟数据；demo_ 实体不会与现有电商实体建立关联。
models:
  - name: demo_customers
    description: 多路径示例客户维表，采购人和账户负责人共用这里定义的地区维度。
    semantic_model:
      enabled: true
    columns:
      - name: customer_id
        description: 模拟客户唯一标识，供采购人和账户负责人两个角色关联。
        entity: {name: demo_customer, type: primary}
        data_tests: [not_null, unique]
      - name: region
        description: 客户所在地区；两条实体路径最终访问的同一个语义维度。
        dimension: {type: categorical}
        data_tests: [not_null]

  - name: demo_accounts
    description: 多路径示例企业账户，每个账户关联一位客户作为负责人。
    semantic_model:
      enabled: true
    columns:
      - name: account_id
        description: 企业账户唯一标识，供采购订单按账户关联。
        entity: {name: demo_account, type: primary}
        data_tests: [not_null, unique]
      - name: owner_customer_id
        description: 账户负责人客户标识，通过 demo_customer 实体关联客户维表。
        entity: {name: demo_customer, type: foreign}
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('demo_customers')
                field: customer_id

  - name: demo_purchase_orders
    description: 多路径示例采购订单，可直接按采购人地区或经企业账户按负责人地区统计。
    semantic_model:
      enabled: true
    agg_time_dimension: ordered_at
    columns:
      - name: purchase_order_id
        description: 采购订单唯一标识；本示例一行代表一笔订单。
        entity: {name: demo_purchase_order, type: primary}
        data_tests: [not_null, unique]
      - name: buyer_customer_id
        description: 实际采购人的客户标识，对应 demo_customer__region 路径。
        entity: {name: demo_customer, type: foreign}
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('demo_customers')
                field: customer_id
      - name: account_id
        description: 订单归属的企业账户，对应 demo_account__demo_customer__region 路径。
        entity: {name: demo_account, type: foreign}
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('demo_accounts')
                field: account_id
      - name: ordered_at
        description: 采购日期，作为示例指标的默认聚合时间。
        granularity: day
        dimension: {type: time}
        data_tests: [not_null]
      - name: amount
        description: 订单金额；四笔模拟订单的总额固定为 500。
        data_tests: [not_null]
    metrics:
      - name: demo_purchase_amount
        description: 模拟企业采购订单总金额，用于验证同一地区维度的两条有效实体路径。
        type: simple
        agg: sum
        expr: amount
