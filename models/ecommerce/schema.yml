# 订单明细与三个唯一维表关联；去重计数与金额口径分别定义。
version: 2
models:
- name: orders
  description: 订单语义模型：一行一条商品明细，以明细金额避免订单总额重复累计。
  semantic_model:
    enabled: true
  agg_time_dimension: order_date
  derived_semantics:
    entities:
    - {name: buyer_history, type: foreign, expr: user_id}
    dimensions:
    - name: item_value_band
      type: categorical
      description: 单条商品明细折后应付额分档，边界为 100 元和 500 元。
      expr: >-
        case when item_paid_amount is null then 'unknown'
             when item_paid_amount < 100 then 'under_100'
             when item_paid_amount < 500 then '100_to_under_500'
             else '500_plus' end
    - name: item_discount_band
      type: categorical
      description: 按明细优惠额占折前额的比例分档，折前额非正或缺值时归入 unknown。
      expr: >-
        case when item_gross_amount is null or item_gross_amount <= 0
                   or item_discount_amount is null then 'unknown'
             when item_discount_amount <= 0 then 'no_discount'
             when item_discount_amount < item_gross_amount * 0.2 then 'under_20pct'
             else '20pct_plus' end
    - name: order_month
      type: time
      granularity: month
      description: 明细所属订单的下单月，取当月第一天。
      expr: date_trunc('month', order_date)
  columns:
  - name: order_item_id
    description: 订单商品明细唯一标识；同一订单可以包含多条明细。
    entity:
      name: order_item
      type: primary
    data_tests:
    - not_null
    - unique
  - name: order_id
    description: 订单标识，明细中允许重复；订单指标按此字段去重。
    dimension:
      type: categorical
    data_tests:
    - not_null
  - name: user_id
    description: 订单购买用户标识。
    entity:
      name: user
      type: foreign
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('users')
          field: user_id
  - name: product_id
    description: 明细商品标识。
    entity:
      name: product
      type: foreign
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('products')
          field: product_id
  - name: store_id
    description: 订单归属店铺标识。
    entity:
      name: store
      type: foreign
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stores')
          field: store_id
  - name: order_date
    description: 订单头下单日期，成交指标仍按下单日期归属，不是支付日期。
    dimension:
      type: time
    granularity: day
    data_tests:
    - not_null
  - name: order_status
    description: 订单当前状态；仅 COMPLETED 计入成交，其他状态不计入。
    dimension:
      type: categorical
  - name: sales_channel
    description: 订单销售渠道。
    dimension:
      type: categorical
  - name: quantity
    description: 明细商品件数，包含非成交状态；成交销量按标记过滤。
    data_tests:
    - not_null
  - name: order_value_band
    description: 整单应付商品额（扣运费）分档，可按商品切分成交订单数。
    dimension: {type: categorical}
  - name: unit_price
    description: 下单时明细商品单价，单位元。
    data_tests:
    - not_null
  - name: item_gross_amount
    description: 明细折前商品金额，单位元，不含运费。
    data_tests:
    - not_null
  - name: item_discount_amount
    description: 明细商品优惠金额，单位元。
    data_tests:
    - not_null
  - name: item_paid_amount
    description: 源 payable_amount：明细折后应付金额，单位元，不含运费；仅成交状态计入成交金额。
    data_tests:
    - not_null
  - name: is_completed
    description: 成交标记：订单状态 COMPLETED 为 1，其余为 0。
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 1
          quote: false
  metrics:
  - name: order_count
    label: 订单数
    description: 所有状态的订单 ID 去重数；跨商品或日期分组不可直接累加。
    type: simple
    agg: count_distinct
    expr: order_id
  - name: completed_order_count
    label: 成交订单数
    description: COMPLETED 订单 ID 去重数；商品分组内仅统计包含该商品的订单。
    type: simple
    agg: count_distinct
    expr: case when is_completed = 1 then order_id else null end
  - name: sales_amount
    label: 成交商品金额
    description: COMPLETED 明细折后商品金额之和，单位元，不含运费，排除已退款订单；不是支付流水净收入。
    type: simple
    agg: sum
    expr: case when is_completed = 1 then item_paid_amount else 0 end
  - name: sales_quantity
    label: 成交销量
    description: COMPLETED 明细商品件数之和。
    type: simple
    agg: sum
    expr: case when is_completed = 1 then quantity else 0 end
  - name: buyer_count
    label: 成交购买人数
    description: COMPLETED 订单的购买用户去重数，跨分组不可直接相加。
    type: simple
    agg: count_distinct
    expr: case when is_completed = 1 then user_id else null end
  # 折前金额和优惠额沿用成交状态与明细粒度，支持类目、渠道、店铺联合分析。
  - name: completed_gross_amount
    label: 成交折前商品额
    description: 成交明细折前金额之和，单位元，不含运费。
    type: simple
    agg: sum
    expr: case when is_completed = 1 then item_gross_amount else 0 end
  - name: completed_discount_amount
    label: 成交商品优惠额
    description: 成交明细优惠金额之和，单位元，归属于下单日期。
    type: simple
    agg: sum
    expr: case when is_completed = 1 then item_discount_amount else 0 end
  - name: selling_store_count
    label: 动销店铺数
    description: 所选期间和商品范围内至少有一笔成交的店铺去重数。
    type: simple
    agg: count_distinct
    expr: case when is_completed = 1 then store_id else null end
- name: users
  description: 用户语义模型：一行一条客户注册记录，会员等级为注册时属性。
  semantic_model:
    enabled: true
  agg_time_dimension: register_date
  columns:
  - name: user_id
    description: 用户唯一标识，源 customer_id。
    entity:
      name: user
      type: primary
    data_tests:
    - not_null
    - unique
  - name: member_level
    description: 注册时的会员等级，不表示下单时的等级。
    dimension:
      type: categorical
  - name: province
    description: 用户所在省份，与店铺省份独立。
    dimension:
      type: categorical
  - name: register_date
    description: 用户注册日期，用户指标默认聚合时间。
    dimension:
      type: time
    granularity: day
    data_tests:
    - not_null
  - name: acquisition_channel
    description: 用户首次获客渠道。
    dimension:
      type: categorical
  - name: registered_at
    description: 用户实际注册时间，供七日转化窗口按秒匹配。
    dimension: {type: time}
    granularity: second
  metrics:
  - name: user_count
    label: 用户数
    description: 当前用户去重数；无时间筛选为全部用户，时间筛选限定注册日期，不是历史存量。
    type: simple
    agg: count_distinct
    expr: user_id
  - name: new_user_count
    label: 新增注册用户数
    description: 按注册日期统计用户去重数；无日期限制时与用户数相同。
    type: simple
    agg: count_distinct
    expr: user_id
  - name: high_spend_user_count
    label: 历史高消费用户数
    description: 按用户累计成交额超过 1000 元筛选，再按用户注册批次计数。
    type: simple
    agg: count_distinct
    expr: user_id
    filter: "{{ Metric('sales_amount', group_by=['user']) }} > 1000"
  - name: registration_events
    label: 注册事件数
    type: simple
    agg: count
    expr: user_id
    agg_time_dimension: registered_at
- name: products
  description: 商品语义模型：一行一个商品，类目、品牌来自 ODS 商品上架记录。
  semantic_model:
    enabled: true
  agg_time_dimension: launched_date
  columns:
  - name: product_id
    description: 商品唯一标识，源 product_id。
    entity:
      name: product
      type: primary
    data_tests:
    - not_null
    - unique
  - name: sku_code
    description: 商品 SKU 编码。
    dimension:
      type: categorical
  - name: product_name
    description: 当前商品名称。
    dimension:
      type: categorical
  - name: category_level1
    description: 商品一级类目。
    dimension:
      type: categorical
  - name: brand_name
    description: 商品品牌。
    dimension:
      type: categorical
  - name: list_price
    description: 当前商品标价，单位元，不作为历史成交价。
  - name: cost_price
    description: 当前商品成本单价，单位元；不用于推算历史毛利。
  - name: launched_date
    description: 商品首次上架日期，商品指标默认聚合时间。
    dimension:
      type: time
    granularity: day
    data_tests:
    - not_null
  metrics:
  - name: product_count
    label: 商品数
    description: 当前目录商品去重数；时间筛选限定首次上架日期，不是历史商品存量。
    type: simple
    agg: count_distinct
    expr: product_id
- name: stores
  description: 店铺语义模型：一行一家店铺，地域属性来自 ODS 入驻记录。
  semantic_model:
    enabled: true
  agg_time_dimension: opened_date
  columns:
  - name: store_id
    description: 店铺唯一标识，源 store_id。
    entity:
      name: store
      type: primary
    data_tests:
    - not_null
    - unique
  - name: store_name
    description: 店铺名称。
    dimension:
      type: categorical
  # 经营报表按唯一店铺键计算，查询结果通过展示模型取得当前名称。
  - name: store_code
    description: 店铺经营分析键，普通分组显示店铺名称，同名店铺分别统计。
    dimension:
      type: categorical
      value_mapping:
        semantic_model: store_directory
        value_dimension: raw_store_id
        display_dimension: display_name
  - name: province
    description: 店铺所在省份，与用户省份独立。
    dimension:
      type: categorical
  - name: opened_date
    description: 店铺开店日期，店铺指标默认聚合时间。
    dimension:
      type: time
    granularity: day
    data_tests:
    - not_null
  metrics:
  - name: store_count
    label: 店铺数
    description: 当前目录店铺去重数；时间筛选限定开店日期，不是历史店铺存量。
    type: simple
    agg: count_distinct
    expr: store_id
  - name: new_store_count
    label: 新开店铺数
    description: 按开店日期统计店铺去重数；无日期限制时与店铺数相同。
    type: simple
    agg: count_distinct
    expr: store_id
metrics:
- name: average_order_value
  label: 成交客单价
  description: 成交商品金额除以成交订单数，单位元/单；不含运费，分母为零时为 NULL。商品分组下表示该组商品贡献的单均金额。
  type: ratio
  type_params:
    numerator: sales_amount
    denominator: completed_order_count
# 先汇总当前分组的分子、分母再计算比率，保留零分母的 NULL。
- name: discount_rate
  label: 成交折扣率（优惠占比）
  description: 成交优惠额除以成交折前商品额，0.1 表示优惠 10%。
  type: ratio
  type_params:
    numerator: completed_discount_amount
    denominator: completed_gross_amount
- name: units_per_order
  label: 成交件单量
  description: 分组内成交件数除以含该组商品的成交订单数，单位件/单。
  type: ratio
  type_params:
    numerator: sales_quantity
    denominator: completed_order_count
- name: average_selling_price
  label: 件均成交价
  description: 成交商品金额除以成交件数，单位元/件，不含运费。
  type: ratio
  type_params:
    numerator: sales_amount
    denominator: sales_quantity
