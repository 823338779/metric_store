version: 2

# 时间骨架是辅助物理模型，不增加业务语义模型数量。
models:
  - name: time_spine
    description: 覆盖下单、注册、商品上架和开店完整日期范围的连续日粒度时间骨架。
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: 四个模型最早业务日至最晚业务日之间的自然日，含首尾日期。
        granularity: day
        data_tests: [not_null, unique]
