version: 2

# 时间骨架是辅助物理模型，不增加业务语义模型数量。
models:
  - name: time_spine
    description: 覆盖下单、注册、商品上架、开店、退款、库存和用户行为的连续自然日。
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: 最早至最晚业务日之间的自然日，含首尾日期。
        granularity: day
        data_tests: [not_null, unique]
