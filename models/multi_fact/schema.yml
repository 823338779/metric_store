version: 2

# 两张事实表共享 consumer、account 实体；账户负责人形成第二条客户维度路径。
models:
  - name: multi_fact_consumers
    description: 共享客户维表，购买人与账户负责人复用同一个 dima 地区定义。
    semantic_model: {enabled: true}
    columns:
      - name: consumer_id
        description: 客户唯一标识，作为两个角色路径的多对一关联目标。
        entity: {name: consumer, type: primary}
        data_tests: [not_null, unique]
      - name: dima
        description: 地区原码；EAST、NORTH、SOUTH 最终显示为华东、华北、华南。
        dimension:
          type: categorical
          value_mapping:
            semantic_model: order_demo_regions
            value_dimension: raw_value
            display_dimension: display_value
        data_tests: [not_null]

  - name: multi_fact_accounts
    description: 共享账户维表，包含账户类型和唯一负责人客户标识。
    semantic_model: {enabled: true}
    columns:
      - name: account_id
        description: 账户唯一标识，两张事实表均通过 account 实体关联。
        entity: {name: account, type: primary}
        data_tests: [not_null, unique]
      - name: owner_consumer_id
        description: 账户负责人客户，形成 account__consumer__dima 多跳路径。
        entity: {name: consumer, type: foreign}
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('multi_fact_consumers'), field: consumer_id}
      - name: dimb
        description: 账户类型原码；1 为企业账户，2 为渠道账户。
        dimension:
          type: categorical
          value_mapping:
            semantic_model: multi_fact_account_types
            value_dimension: raw_value
            display_dimension: display_value
        data_tests: [not_null]

  - name: multi_fact_account_types
    description: 账户类型显示字典，每个原始代码严格对应一行。
    semantic_model: {enabled: true}
    columns:
      - name: code
        description: 账户类型的唯一原始代码。
        entity: {name: account_type_key, type: primary}
        dimension: {name: raw_value, type: categorical}
        data_tests: [not_null, unique]
      - name: label
        description: 账户类型的中文显示名称。
        dimension: {name: display_value, type: categorical}
        data_tests: [not_null]

  - name: multi_fact_orders
    description: 订单事实表，一行一单，六笔订单总金额 800 元。
    semantic_model: {enabled: true}
    agg_time_dimension: ordered_at
    columns:
      - name: order_id
        description: 订单唯一标识，不与退款明细直接连接计算订单金额。
        entity: {name: multi_fact_order, type: primary}
        data_tests: [not_null, unique]
      - name: consumer_id
        description: 购买人客户标识，对应 consumer__dima 路径。
        entity: {name: consumer, type: foreign}
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('multi_fact_consumers'), field: consumer_id}
      - name: account_id
        description: 订单所属账户，对应账户类型及账户负责人两条维度路径。
        entity: {name: account, type: foreign}
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('multi_fact_accounts'), field: account_id}
      - name: ordered_at
        description: 下单日期，固定为 2026-10-01；metric_a 的默认聚合时间。
        dimension: {type: time}
        granularity: day
        data_tests: [not_null]
      - name: amount
        description: 订单金额，单位元，decimal(18, 2)。
        data_tests: [not_null]
    metrics:
      - name: metric_a
        label: 订单金额（跨表演示）
        description: 只聚合订单事实表金额，总计 800 元；一单多次退款不增加订单金额。
        type: simple
        agg: sum
        expr: amount

  - name: multi_fact_refunds
    description: 退款事实表，一行一笔退款，四笔退款总金额 155 元。
    semantic_model: {enabled: true}
    agg_time_dimension: refunded_at
    columns:
      - name: refund_id
        description: 退款唯一标识；订单 1001 对应两笔不同退款。
        entity: {name: refund, type: primary}
        data_tests: [not_null, unique]
      - name: order_id
        description: 所属订单标识，可重复；只做引用完整性校验，不作为跨事实表指标连接路径。
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('multi_fact_orders'), field: order_id}
      - name: consumer_id
        description: 退款对应的原订单购买人，与 metric_a 共享 consumer 维度路径。
        entity: {name: consumer, type: foreign}
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('multi_fact_consumers'), field: consumer_id}
      - name: account_id
        description: 退款对应的原订单账户，与 metric_a 共享 account 维度路径。
        entity: {name: account, type: foreign}
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('multi_fact_accounts'), field: account_id}
      - name: refunded_at
        description: 退款发生日期，固定为 2026-10-02；metric_b 的默认聚合时间。
        dimension: {type: time}
        granularity: day
        data_tests: [not_null]
      - name: amount
        description: 单笔退款金额，单位元，decimal(18, 2)。
        data_tests: [not_null]
    metrics:
      - name: metric_b
        label: 退款金额（跨表演示）
        description: 只聚合退款事实表金额，总计 155 元；无退款的维度组合保留 NULL。
        type: simple
        agg: sum
        expr: amount
