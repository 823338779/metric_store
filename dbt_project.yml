name: metric_store
version: '1.0.0'
config-version: 2
profile: metric_store
require-dbt-version: [">=1.12.0", "<3.0.0"]
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]
vars:
  data_start: '2020-01-01'
  data_end: '2027-12-31'
models:
  metric_store:
    example:
      +enabled: false
    staging:
      +materialized: view
      +schema: staging
    dimensions:
      +materialized: table
      +schema: dimensions
    facts:
      +materialized: incremental
      +incremental_strategy: "{{ 'merge' if target.type == 'databricks' else 'delete+insert' }}"
      +on_schema_change: fail
      +schema: facts
    marts:
      +materialized: table
      +schema: marts
    semantic:
      +materialized: table
